name: Editorial QC
# Runs the essay quality gate and rebuilds the database on every change to the publication folder.
on:
  pull_request:
    paths: ["moodius-aurelius/substack/**"]
  push:
    paths: ["moodius-aurelius/substack/**"]
jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 moodius-aurelius/substack/scripts/qc.py
      - run: python3 moodius-aurelius/substack/scripts/build_db.py
