# One small VPS (2 GB RAM is enough): Postgres + the agent + n8n (schedules only) + Caddy (HTTPS).
# Start:   docker compose up -d --build
# Migrate: docker compose run --rm app npx tsx scripts/migrate.ts
# Without n8n: comment out the n8n service and enable `worker` instead.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moodius
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: moodius
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodius"]
      interval: 10s

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://moodius:${POSTGRES_PASSWORD}@db:5432/moodius
      NODE_ENV: production
    depends_on:
      db: { condition: service_healthy }

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:-n8n.localhost}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST:-n8n.localhost}/
      GENERIC_TIMEZONE: ${APP_TIMEZONE:-Europe/Madrid}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      AGENT_URL: http://app:3000
      CRON_SECRET: ${CRON_SECRET}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes: [n8ndata:/home/node/.n8n]
    depends_on: [app]

  # worker:            # alternative to n8n: same jobs, same intervals
  #   build: .
  #   restart: unless-stopped
  #   env_file: .env
  #   environment:
  #     DATABASE_URL: postgres://moodius:${POSTGRES_PASSWORD}@db:5432/moodius
  #   command: ["npx", "tsx", "scripts/worker.ts"]
  #   depends_on: [db]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      AGENT_HOST: ${AGENT_HOST:?set AGENT_HOST in .env}
      N8N_HOST: ${N8N_HOST:-n8n.localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [app]

volumes: { pgdata: {}, n8ndata: {}, caddydata: {} }
