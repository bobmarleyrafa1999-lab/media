    - name: Glad
      words: [content, relieved, grateful, proud, hopeful, playful, amused, peaceful, energised, delighted]
    - name: Connected
      words: [loved, accepted, trusted, close, understood, tender, safe, valued, included, warm]
    - name: Unsettled
      words: [restless, confused, torn, ambivalent, flat, numb, bored, impatient, jealous, envious]

