  - n: 26
    part: 6
    title: Values Are Not Goals
    quote:
      text: "If you don't know which harbour you are sailing for, no wind is the right wind."
      cite: Moodius paraphrase of Seneca, Moral Letters 71.3
      kind: paraphrase
    reading: |
      A goal is something you can finish: run a marathon, get the job, pay off the card. A value is a direction you keep travelling: being honest, being curious, being someone people can rely on. You never finish being kind. You just keep choosing it, or not.

      The difference matters. Goals are useful, but if they're all you have, your life becomes a series of finish lines, with a dip after each one. Values give you something to steer by between the finish lines, and when goals fail.

      Seneca's harbour is the direction, not the destination. Without one, you're pushed around by whatever's blowing: other people's priorities, your phone, your moods. Today you'll name the harbour.
    evidence:
      tier: Empirical
      note: "Acceptance and Commitment Therapy (ACT) distinguishes values from goals and uses values to guide action. Clinical trials of ACT as a whole show benefits for several conditions; this journal uses the idea, not the therapy. Evidence: moderate for ACT overall."
      refs: [hayes_2012]
    prompts:
      - What goals are you currently chasing?
      - For each one, what value is underneath it? Why does it matter?
      - Which of your values isn't served by any of your goals?
    exercise:
      name: Values sort
      steps: |
        Turn to the list of values at the back. Read it slowly and tick every value that matters to you. Then cross out ticks until only ten remain. Then five. Write your five here, each with one sentence on what it means to you, in your own words.
    tonight: Which value did you act on today?

  - n: 27
    part: 6
    title: Your Values in Your Calendar
    quote:
      text: "Every habit and faculty is maintained and increased by the corresponding actions: the habit of walking by walking, the habit of running by running."
      cite: Epictetus, Discourses 2.18 (tr. George Long)
      kind: verbatim
      source: epictetus_long
      match: "Every habit and faculty is maintained and increased by the corresponding actions: the habit of walking by walking, the habit of running by running."
    reading: |
      It's easy to say what you value. Your calendar and your bank statement say it more accurately. If you value family but you're never home, or health but you haven't moved in weeks, that's not hypocrisy. It's information: something else is running your time.

      Epictetus's point is that character is built by repetition. You become patient by practising patience, honest by practising honesty. A value that never gets acted on doesn't stay a value for long. It becomes a nice idea about yourself.

      Today you'll compare your five values with your last week. Expect gaps. Everyone has them. The aim isn't guilt; it's to see where the week went, so you can decide where next week goes.
    evidence:
      tier: Empirical
      note: "Research on self-affirmation, reviewed by Cohen and Sherman, found that briefly reflecting on important values can buffer stress and, in some settings, improve performance. Some results, especially in education, have replicated weakly. Evidence: mixed but real."
      refs: [cohen_sherman_2014]
    prompts:
      - Look at your last seven days. Where did the time go?
      - Which of your five values got the most time? Which got none?
      - What is taking the time your values aren't getting?
    exercise:
      name: The week audit
      steps: |
        List your five values. Next to each, write how many hours last week you spent on things that clearly served it. Be honest, estimates are fine. Then write one change to next week's calendar that would give your most neglected value an hour.
    tonight: Where did today's hours go?

  - n: 28
    part: 6
    title: The Cost of a Value
    quote:
      text: "It is not the man who has too little, but the man who craves more, that is poor."
      cite: Seneca, Moral Letters 2.6 (tr. Richard M. Gummere)
      kind: verbatim
      source: seneca_gummere_checked
      match: "It is not the man who has too little, but the man who craves more, that is poor."
    reading: |
      Every real value costs something. Honesty costs comfort. Loyalty costs freedom. Ambition costs time. Contentment costs the thrill of always wanting more. If a value has never cost you anything, it may not be one of yours yet.

      Seneca writes as a rich man, which makes his line more interesting, not less. He knew that wanting more doesn't stop at enough. The craving keeps moving the line, and whoever is chasing it stays poor at any income.

      Some wants are borrowed. They came from advertising, comparison, or what your family or friends prize. Others are genuinely yours. Today, look at what you're paying for your values, and whether some of what you chase was ever really yours to want.
    evidence:
      tier: Empirical
      note: "Kasser and Ryan found that people who prioritise extrinsic aspirations (wealth, image, fame) over intrinsic ones (relationships, growth, community) report lower wellbeing on average. Evidence: replicated in many countries; correlational, and the size of the link varies."
      refs: [kasser_ryan_1996]
    prompts:
      - What does each of your five values cost you?
      - What are you chasing that might be borrowed rather than yours?
      - What would "enough" look like, in one area of your life?
    exercise:
      name: Borrowed or mine
      steps: |
        List five things you want at the moment. For each, ask: where did this want come from? Would I still want it if nobody would ever know I had it? Mark each one B (borrowed) or M (mine). For one B, write what you'd do with the time and money if you let it go.
    tonight: What did you not need today?

  - n: 29
    part: 6
    title: Small Commitments
    quote:
      text: "Don't let the whole of your life crush you at once. Ask, of this present moment: what here is unbearable? You'll be embarrassed to answer."
      cite: Moodius paraphrase of Marcus Aurelius, Meditations 8.36
      kind: paraphrase
    reading: |
      After twenty-eight days of looking, there's a temptation to change everything. New routine, new habits, new you, starting Monday. Most of those plans collapse by Thursday. Not because people are weak, but because big plans are heavy, and life keeps happening.

      Marcus's answer to the weight of a whole life is the present moment. You don't have to live your values for the rest of your life. You have to live them today, in one specific way. Then again tomorrow.

      So the commitments you make today should be small enough that they survive a bad week. One action for each of three values, attached to something you already do, with an "if-then" plan for the moment it's likely to slip.
    evidence:
      tier: Empirical
      note: "Gollwitzer and Sheeran's meta-analysis supports \"if-then\" planning (see Day 10). Research on habit formation suggests attaching new behaviour to an existing cue and keeping it small makes it more likely to stick, though how long habits take to form varies enormously between people."
      refs: [gollwitzer_sheeran_2006, lally_2010]
    prompts:
      - Of everything you've noticed in this journal, what do you most want to carry forward?
      - What has derailed your past attempts to change?
      - What's the smallest action that would still mean something?
    exercise:
      name: Three commitments
      steps: |
        Choose three of your five values. For each, write one small action you'll take daily or weekly for the next thirty days, the existing habit you'll attach it to, and an "if-then" plan for when it slips. Example: "Curiosity: after my morning coffee, I read ten pages. If I skip it, then I read two pages before bed."
    tonight: Which commitment feels most alive?

  - n: 30
    part: 6
    title: The Examined Self
    quote:
      text: "Look within. Within is the spring of good, and it will keep flowing if you keep digging."
      cite: Moodius paraphrase of Marcus Aurelius, Meditations 7.59
      kind: paraphrase
    reading: |
      Thirty days ago you wrote a letter to yourself. It's time to read it.

      Before you do, notice what you've practised. You've watched your own mind. You've pulled events apart from the stories you tell about them. You've named feelings precisely and asked what they were for. You've looked at how you move in closeness, the story of your life, the roles you play, the gap between private and public, and what you live by.

      Socrates' examined life isn't a project you complete. It's a habit of looking, and you now have the beginnings of it. Marcus's image fits: the spring is there, and it keeps flowing as long as you keep digging. Read the letter. Then write one more.
    evidence:
      tier: Moodius opinion
      note: "We think the most valuable thing you take from these thirty days is not any single insight but the habit of asking: what's actually happening, what's mine, what do I feel, what matters? Keep asking. The research on expressive writing suggests even brief, regular writing about what matters to you can help many people, though not everyone."
      refs: [frattaroli_2006]
    prompts:
      - Read your Day 1 letter. What has changed? What hasn't?
      - What did you learn about yourself that surprised you most?
      - Which day would you go back to? Why?
    exercise:
      name: The second letter
      steps: |
        Write a letter to yourself to open in three months. What you understand now that you didn't thirty days ago; what you're committing to; what you want to remember when things get hard. Seal it, date it, and put a reminder in your calendar.
    tonight: One word for how you feel, thirty days in.

review:
  heading: Part review
  prompts:
    - What did I notice most in this part?
    - What surprised me, or made me uncomfortable?
    - Which exercise was most useful, and why?
    - One thing I'll carry into the next part.
  scale: "On a scale of 1 to 10, how clearly do I see myself in this area now? What would make it one point higher?"

vocabulary:
  heading: A vocabulary of feeling
  intro: Use this on Day 12 and any time "fine", "stressed" or "bad" isn't enough. The groups are loose; many words fit more than one.
  groups:
    - name: Angry
      words: [irritated, annoyed, frustrated, resentful, indignant, bitter, exasperated, offended, furious, betrayed]
    - name: Afraid
      words: [uneasy, nervous, apprehensive, dreading, insecure, panicked, overwhelmed, wary, exposed, vulnerable]
    - name: Sad
      words: [disappointed, lonely, grieving, homesick, discouraged, hurt, empty, wistful, heavy, let down]
    - name: Ashamed
