      refs: [campbell_1996]
    prompts:
      - What do you do in private that you wouldn't want seen? No judgement, just honesty.
      - Where is the gap between your public and private self widest?
      - What would closing that gap a little look like?
    exercise:
      name: The alignment audit
      steps: |
        Make two columns: "How I'd describe myself" and "What my private hours show". Fill in five rows. Mark the row with the biggest gap. Write one small, specific change that would narrow it, and when you'll make it.
